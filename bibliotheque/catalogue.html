for (const [cat, items] of Object.entries(DATA)) {
  let html = `<section><h2>${cat} (${items.length})</h2><div class="grid">`;
  for (const [file, size] of items) {
    const path = `${cat}/${file}`;
    let preview = `<img loading="lazy" src="${path}">`;
    if (file.endsWith('.ogg')) preview = `<audio controls preload="none" src="${path}"></audio>`;
    if (file.endsWith('.ttf')) preview = `<style>@font-face{font-family:'${file}';src:url('${path}')}</style><div class="font" style="font-family:'${file}'">Abc 123</div>`;

  }

}
document.getElementById('q').oninput = (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.item').forEach((el) => { el.style.display = el.dataset.name.includes(q) ? '' : 'none'; });
  document.querySelectorAll('section').forEach((s) => { s.style.display = s.querySelector('.item:not([style*="none"])') ? '' : 'none'; });
};
main.onclick = (e) => {
  const el = e.target.closest('.item');
  if (!el || e.target.tagName === 'AUDIO') return;
  const cmd = `cp bibliotheque/${el.dataset.path} src/assets/${DEST[el.dataset.cat] || 'sprites'}/`;
  navigator.clipboard?.writeText(cmd);
  const t = document.getElementById('toast');
  t.textContent = 'Copié : ' + cmd; t.style.display = 'block';
  clearTimeout(t.timer); t.timer = setTimeout(() => (t.style.display = 'none'), 2500);
};
